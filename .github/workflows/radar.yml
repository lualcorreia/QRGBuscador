name: Atualizar Radar HF CPDLC

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  extrair-dados:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: pip install -r requirements.txt

      - name: Executar Extração (Selenium)
        run: python gerar_dados_radar.py

      - name: Commit e Push do dados_radar.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dados_radar.json
          git commit -m "Automated update: HF Radar Data [skip ci]" || echo "Nenhuma alteração nos dados."
          git push
